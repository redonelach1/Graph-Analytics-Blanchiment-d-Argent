# =============================================================================
# Spark Configuration Defaults
# Mini-Projet 17 — AML Graph Analytics
# =============================================================================

# Delta Lake extensions
spark.sql.extensions                     io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog          org.apache.spark.sql.delta.catalog.DeltaCatalog

# Timezone — all timestamps in UTC
spark.sql.session.timeZone               UTC

# Adaptive Query Execution
spark.sql.adaptive.enabled               true
spark.sql.adaptive.coalescePartitions.enabled  true
spark.sql.adaptive.skewJoin.enabled      true

# Shuffle tuning (local dev — small cluster)
spark.sql.shuffle.partitions             8

# Driver & executor memory (local dev)
spark.driver.memory                      2g
spark.executor.memory                    2g

# GraphFrames checkpoint (required for connected components)
# Set programmatically — this is a fallback
spark.graphframes.connectedComponents.broadcastThreshold  -1

# Structured Streaming
spark.sql.streaming.schemaInference      false

